name: Linux candidate
on:
  workflow_call:
    inputs:
      version:
        type: string
        default: 0.1.0-preview.1
      source-commit:
        type: string
        default: ""
    outputs:
      artifact:
        value: ${{ jobs.build.outputs.artifact }}
permissions:
  contents: read
jobs:
  build:
    name: Build, package and Native AOT
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18.0@sha256:41fc5342eefba6cc2ccda736aaf034bbbb7c3df0fdb81516eba1ba33f360162c
        env:
          POSTGRES_USER: nativeweave
          POSTGRES_DB: postgres
          # Isolated test database: the permission oracle creates its own login role.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - "127.0.0.1:5432:5432"
        options: >-
          --health-cmd "pg_isready -U nativeweave -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    outputs:
      artifact: nativeweave-linux-${{ github.run_id }}-${{ github.run_attempt }}
    env:
      CI: "true"
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      PACKAGE_VERSION: ${{ inputs.version }}
      NW_TEST_POSTGRES: postgresql://nativeweave@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source-commit || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
      - name: Install native build prerequisites and pinned Rust
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang zlib1g-dev qemu-user
          rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
      - name: Verify source, package, API documentation and actual AOT consumers
        run: python3 eng/build.py verify --version "$PACKAGE_VERSION"
      - name: Verify a fresh Linux SDK container with no Rust installed
        run: |
          docker run --rm \
            -v "$PWD:/work:ro" -v "$PWD/artifacts:/work/artifacts" -w /work \
            -e PACKAGE_VERSION -e DOTNET_CLI_TELEMETRY_OPTOUT=1 \
            mcr.microsoft.com/dotnet/sdk:11.0.100-resolute-amd64@sha256:7913685c883a29dd8ba79da96172f5c6b29ed9be706ebe95935e3ef45f19c9c1 \
            bash eng/consume-linux.sh
      - name: Reject generated source or dependency drift
        run: git diff --exit-code
      - name: Verify Task-04 Linux package closure and runtime transfer
        run: bash eng/verify-task04-linux.sh
      - name: Reject Task-04 source or dependency drift
        run: git diff --exit-code
      - name: Verify Task-07 domain packages and pristine Linux consumers
        run: bash eng/verify-task07-linux.sh
      - name: Reject Task-07 source or dependency drift
        run: git diff --exit-code
      - name: Restore runner ownership of exported Task-07 evidence
        if: always()
        run: |
          # Atomic JSON files created by root inside the SDK container are 0600.
          # Only the declared export directories change owner; working feeds,
          # databases, TLS keys and consumer caches remain outside this scope.
          task07_owner="$(id -u):$(id -g)"
          for task07_evidence in \
            artifacts/task07/B24/prepared/evidence \
            artifacts/task07/B24/release/evidence \
            artifacts/task07/B24/runtime/evidence \
            artifacts/task07/B24/evidence; do
            if sudo test -d "$task07_evidence"; then
              sudo chown -R --no-dereference "$task07_owner" "$task07_evidence"
            fi
          done
      - name: Retain verification logs and evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nativeweave-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/logs/
            artifacts/verification.json
            artifacts/consumer-result.json
            artifacts/pristine-consumer.json
            artifacts/task04/
            !artifacts/task04/**/cargo-target/**
            artifacts/task07/B24/native-build/manifest.json
            artifacts/task07/B24/prepared/manifest.json
            artifacts/task07/B24/prepared/evidence/
            artifacts/task07/B24/release/evidence/
            artifacts/task07/B24/runtime/evidence/
            artifacts/task07/B24/evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Retain the exact verified candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nativeweave-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/packages/
          if-no-files-found: error
          retention-days: 14
