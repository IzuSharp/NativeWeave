name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Canonical package version (for example 0.1.0-preview.1)
        type: string
        required: true
      publish:
        description: Publish the verified candidate to nuget.org
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: nativeweave-release
  cancel-in-progress: false
jobs:
  identity:
    name: Validate release identity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require main or a tag on main
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then test "$GITHUB_REF" = refs/heads/main; fi
          git merge-base --is-ancestor HEAD origin/main
      - name: Validate package version
        id: identity
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          else
            RELEASE_VERSION="$REQUESTED_VERSION"
          fi
          export RELEASE_VERSION
          python3 eng/release.py identity
  candidate:
    needs: identity
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.identity.outputs.version }}
  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      pull-requests: read
      security-events: write
  publish:
    name: Publish verified NuGet candidate
    needs: [identity, candidate, security]
    if: >-
      github.repository == 'IzuSharp/NativeWeave' &&
      vars.NUGET_PUBLISH_ENABLED == 'true' &&
      (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: nuget
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.identity.outputs.version }}
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Install consumer Native AOT prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang zlib1g-dev
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.candidate.outputs.artifact }}
          path: artifacts/packages/
      - name: Validate retained bytes and source identity before obtaining credentials
        run: python3 eng/release.py validate
      - name: Exchange GitHub identity for a short-lived NuGet credential
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish, verify registry signature and consume registry bytes
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: python3 eng/release.py publish
      - name: Retain registry verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nativeweave-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/publication.json
            artifacts/consumer-result.json
            artifacts/logs/
          if-no-files-found: warn
          retention-days: 30
