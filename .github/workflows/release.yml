name: Release
on:
  push:
    tags: ["v*"]
  pull_request_target:
    branches: [main]
    types: [closed]
  workflow_dispatch:
    inputs:
      version:
        description: Optional version override (leave empty for an automatic preview)
        type: string
        required: false
      publish:
        description: Publish the verified candidate to nuget.org
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: nativeweave-release
  queue: max
  cancel-in-progress: false
jobs:
  identity:
    name: Validate release identity
    if: >-
      github.event_name != 'pull_request_target' ||
      (github.event.action == 'closed' && github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.identity.outputs.version }}
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Only the accepted merge commit, never the PR's unmerged head.
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require main or a tag on main
        id: source
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != push ]; then test "$GITHUB_REF" = refs/heads/main; fi
          git merge-base --is-ancestor HEAD origin/main
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Allocate package version
        id: identity
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 eng/release.py identity
  candidate:
    needs: identity
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.identity.outputs.version }}
      source-commit: ${{ needs.identity.outputs.commit }}
  security:
    needs: identity
    uses: ./.github/workflows/security.yml
    with:
      source-commit: ${{ needs.identity.outputs.commit }}
    permissions:
      contents: read
      pull-requests: read
      security-events: write
  publish:
    name: Publish verified NuGet candidate
    needs: [identity, candidate, security]
    if: >-
      github.repository == 'IzuSharp/NativeWeave' &&
      vars.NUGET_PUBLISH_ENABLED == 'true' &&
      (github.event_name == 'push' ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.merged == true) ||
      inputs.publish)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: nuget
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.identity.outputs.version }}
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.identity.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
      - name: Install consumer Native AOT prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang zlib1g-dev
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.candidate.outputs.artifact }}
          path: artifacts/packages/
      - name: Validate retained bytes and source identity before obtaining credentials
        # Reuse the version and artifact allocated by the producer, even when only
        # failed jobs are rerun. Never derive a new version in the publishing job.
        run: python3 eng/release.py validate
      - name: Exchange GitHub identity for a short-lived NuGet credential
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish, verify registry signature and consume registry bytes
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: python3 eng/release.py publish
      - name: Retain registry verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nativeweave-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/publication.json
            artifacts/consumer-result.json
            artifacts/logs/
          if-no-files-found: warn
          retention-days: 30
